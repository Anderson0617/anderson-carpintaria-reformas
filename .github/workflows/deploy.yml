name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_PUBLISH_WORKER_URL: ${{ secrets.VITE_PUBLISH_WORKER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Supabase URL file
        shell: bash
        run: |
          url_file="supabase url/COLE SUA URL AQUI.txt"
          supabase_url="$(tr -d '[:space:]' < "$url_file")"

          if [[ "$supabase_url" == "COLE_SUA_URL_AQUI" ]]; then
            echo "Arquivo da URL ainda não foi preenchido; usando o segredo do GitHub."
          elif [[ "$supabase_url" =~ ^https://[A-Za-z0-9.-]+\.supabase\.co/?$ ]]; then
            echo "VITE_SUPABASE_URL=$supabase_url" >> "$GITHUB_ENV"
            echo "URL do Supabase carregada pelo arquivo."
          else
            echo "URL inválida em: $url_file"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Supabase env
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$VITE_PUBLISH_WORKER_URL"

      - name: Build
        run: npm run build

      - name: Check dist
        run: test -d dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
